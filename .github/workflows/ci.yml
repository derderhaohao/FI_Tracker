name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block personal data files
        run: npm run check:data
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Unit and component tests, with the coverage gate
        run: npm run coverage
      - name: Coverage summary
        if: always()
        run: test -f coverage/coverage-summary.json && node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Monte Carlo performance (10,000 runs under 5 s)
        run: npm run perf
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke tests
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
